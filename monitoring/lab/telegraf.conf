[agent]
  interval = "2s"
  flush_interval = "2s"
  hostname = "resolver-lab"
  omit_hostname = false
[[inputs.file]]
  files = ["/metrics/unbound.lp"]
  data_format = "influx"
  influx_timestamp_precision = "1ns"
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "lab"
  bucket = "resolver-lab"
