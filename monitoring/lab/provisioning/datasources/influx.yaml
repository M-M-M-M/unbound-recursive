apiVersion: 1
datasources:
  - name: Resolver lab Flux
    uid: resolver-lab-flux
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: lab
      defaultBucket: resolver-lab
      timeInterval: 2s
    secureJsonData:
      token: $LAB_TOKEN
