# Optional native input. Only for a trusted operator-approved Telegraf instance.
[[inputs.unbound]]
  binary = "/usr/sbin/unbound-control"
  config_file = "/etc/telegraf/unbound-control.conf"
  use_sudo = false
  timeout = "5s"
  thread_as_tag = true
  histogram = false
  interval = "30s"
  [inputs.unbound.tags]
    service = "unbound-recursive"
