# Linux host only. Explicitly opt in: the socket grants resolver administration.
# Pre-create CONTROL_DIR with approved owner 10001:10001, mode 0750; see docs.
services:
  unbound:
    tmpfs: !override
      - /tmp:uid=10001,gid=10001,mode=0700,size=16m
    volumes:
      - ${CONTROL_DIR:?Set an approved control directory}:/run/resolver
