# Development snapshots only. Production release gates: docs/HARDENING.md.
name: Build and qualify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: resolver-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Offline Perl tests
        run: make test-unit
      - name: Build from current Debian packages
        run: docker build --pull --no-cache -t unbound-recursive:dev .
      - name: Inventory installed Debian packages
        run: docker run --rm --network none --entrypoint dpkg-query unbound-recursive:dev -W > packages.tsv
      - name: Audit runtime dependencies
        run: make audit-runtime > runtime-audit.txt
      - name: Qualify deterministic DNSSEC validation
        run: make test-dnssec
      - name: Record image size
        run: |
          docker image inspect unbound-recursive:dev --format '{{.Size}}' > image-size-bytes.txt
          printf 'Image size (uncompressed bytes): %s\n' "$(cat image-size-bytes.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start and qualify image
        env:
          UNBOUND_IMAGE: unbound-recursive:dev
        run: |
          docker compose up -d --wait
          make test
          make test-state
          TEST_BIND_PROVISION=1 make test-state-bind
      - name: Diagnostics and cleanup
        if: always()
        run: |
          UNBOUND_IMAGE=unbound-recursive:dev docker compose logs --tail=100
          UNBOUND_IMAGE=unbound-recursive:dev docker compose down -v
      - name: Trivy full vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: unbound-recursive:dev
          scanners: vuln
          format: json
          output: vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
          cache: false
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          image-ref: unbound-recursive:dev
          format: cyclonedx
          output: sbom.json
          exit-code: '0'
          cache: false
      - name: Save security evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: security-${{ matrix.arch }}
          path: |
            vulnerabilities.json
            sbom.json
            packages.tsv
            runtime-audit.txt
            image-size-bytes.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce vulnerability policy
        run: perl scripts/vulnerability-gate.pl vulnerabilities.json
      - name: Export exactly the tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          docker image inspect unbound-recursive:dev --format '{{.Id}}' > image-id.txt
          docker save unbound-recursive:dev -o image.tar
          sha256sum image.tar sbom.json vulnerabilities.json image-id.txt > SHA256SUMS
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: tested-${{ matrix.arch }}
          path: |
            image.tar
            image-id.txt
            sbom.json
            vulnerabilities.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: qualify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      repo: ${{ steps.candidate.outputs.repo }}
      digest: ${{ steps.candidate.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-*
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Push tested platform images and assemble candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            (cd "tested-$arch" && sha256sum --check SHA256SUMS)
            docker load -i "tested-$arch/image.tar"
            test "$(docker image inspect unbound-recursive:dev --format '{{.Id}}')" = "$(cat "tested-$arch/image-id.txt")"
            test "$(docker image inspect unbound-recursive:dev --format '{{.Os}}/{{.Architecture}}')" = "linux/$arch"
            ref="$repo:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$arch"
            docker tag unbound-recursive:dev "$ref"
            docker push "$ref"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "${arch}=$digest" >> "$GITHUB_OUTPUT"
            printf '%s@%s\n' "$repo" "$digest" > "digest-$arch.txt"
            # Confirm the remote manifest references the tested config ID.
            test "$(docker buildx imagetools inspect "$repo@$digest" --raw | jq -er '.config.digest')" = "$(cat "tested-$arch/image-id.txt")"
          done
          candidate="$repo:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create -t "$candidate" "$(cat digest-amd64.txt)" "$(cat digest-arm64.txt)"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$repo@$digest" --raw | jq -e --arg a "$(cut -d@ -f2 digest-amd64.txt)" --arg b "$(cut -d@ -f2 digest-arm64.txt)" '(.manifests | length == 2) and any(.manifests[]; .digest == $a and .platform.architecture == "amd64" and .platform.os == "linux") and any(.manifests[]; .digest == $b and .platform.architecture == "arm64" and .platform.os == "linux")'
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.candidate.outputs.repo }}
          subject-digest: ${{ steps.candidate.outputs.amd64 }}
          sbom-path: tested-amd64/sbom.json
          push-to-registry: true
      - name: Attest arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.candidate.outputs.repo }}
          subject-digest: ${{ steps.candidate.outputs.arm64 }}
          sbom-path: tested-arm64/sbom.json
          push-to-registry: true
      - name: Attest manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.candidate.outputs.repo }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
      - name: Sign and verify immutable manifest
        env:
          REPO: ${{ steps.candidate.outputs.repo }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes "$REPO@$DIGEST"
          cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/build.yaml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REPO@$DIGEST"
  consumer-verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Start with an empty registry credential configuration
        run: |
          set -eu
          config=$(mktemp -d)
          printf 'DOCKER_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Verify public candidate as an anonymous consumer
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          REPO: ${{ needs.publish.outputs.repo }}
        run: |
          set -eu
          unset GH_TOKEN GITHUB_TOKEN
          # No registry login in this job; credential directory starts empty.
          test "$(perl scripts/deploy.pl verify "$DIGEST")" = "$REPO@$DIGEST"
          printf 'Anonymous signature, provenance and both SBOMs verified: %s@%s\n' "$REPO" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  promote:
    needs: [publish, consumer-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Promote only verified manifest
        shell: bash
        env:
          REPO: ${{ needs.publish.outputs.repo }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          # Record the exact old index before changing the mutable tag.
          if previous=$(docker buildx imagetools inspect "$REPO:latest" --format '{{json .Manifest}}' | jq -er '.digest'); then
            [[ "$previous" =~ ^sha256:[a-f0-9]{64}$ ]] || previous=unavailable
          else
            previous=unavailable
          fi
          docker buildx imagetools create -t "$REPO:latest" -t "$REPO:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$REPO@$DIGEST"
          test "$(docker buildx imagetools inspect "$REPO:latest" --format '{{json .Manifest}}' | jq -er '.digest')" = "$DIGEST"
          docker buildx imagetools inspect "$REPO:latest"
          {
            printf '### Deployment qualification inputs\n\n'
            printf 'Previous manifest digest: `%s`\n\n' "$previous"
            printf 'Published manifest digest: `%s`\n\n' "$DIGEST"
            printf 'Use distinct multiarchitecture digests in Qualify signed deployment and rollback.\n'
            if [ "$previous" = "$DIGEST" ] || [ "$previous" = unavailable ]; then
              printf 'Select an older approved index from a prior successful publication.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
