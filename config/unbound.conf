server:
    # Compose publishes only on host loopback. Never publish this configuration
    # on a public interface: Docker NAT may hide the real client address.
    interface: 0.0.0.0
    port: 5353
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.30.53.0/24 allow
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    do-daemonize: no
    use-syslog: no
    logfile: ""
    verbosity: 1
    log-queries: no
    log-replies: no
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    val-permissive-mode: no
    root-hints: "/usr/share/dns/root.hints"
    auto-trust-anchor-file: "/state/root.key"
    module-config: "validator iterator"
    minimal-responses: yes
    edns-buffer-size: 1232
    num-threads: 1
    msg-cache-size: 32m
    rrset-cache-size: 64m
    prefetch: yes
    prefetch-key: yes
    # Conservative initial limits; not an Internet-facing DDoS defence.
    ip-ratelimit: 100
    ratelimit: 200
    extended-statistics: yes
    statistics-cumulative: yes
    statistics-interval: 0
    # Local-only liveness record; not a DNSSEC or Internet reachability test.
    local-zone: "resolver-health.test." static
    local-data: "resolver-health.test. 60 IN A 192.0.2.53"
remote-control:
    control-enable: yes
    control-interface: "/run/resolver/control.sock"
    control-use-cert: no
