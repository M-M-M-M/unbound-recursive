# Development benchmark only. No production state or public DNS traffic.
services:
  unbound:
    image: unbound-recursive:dev
    pull_policy: never
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/resolver:uid=10001,gid=10001,mode=0750,size=1m
      - /tmp:uid=10001,gid=10001,mode=0700,size=16m
    volumes:
      - state:/state
      - ./resolver.conf:/etc/unbound/recursive.conf:ro
    networks: [isolated]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    logging: {driver: local, options: {max-size: '10m', max-file: '5'}}
  fixture:
    image: unbound-recursive:dev
    pull_policy: never
    entrypoint: ['/usr/sbin/unbound', '-d', '-c', '/etc/unbound/fixture.conf']
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: 'service:unbound'
    volumes: ['./fixture.conf:/etc/unbound/fixture.conf:ro']
    healthcheck: {disable: true}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    logging: {driver: local, options: {max-size: '10m', max-file: '2'}}
  client:
    image: ${BENCH_CLIENT_IMAGE:?private benchmark image required}
    pull_policy: never
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=32m
    networks: [isolated]
    mem_limit: 256m
    cpus: 2.0
    pids_limit: 64
    logging: {driver: local, options: {max-size: '10m', max-file: '2'}}
networks:
  isolated: {internal: true, enable_ipv6: false}
volumes:
  state: {}
